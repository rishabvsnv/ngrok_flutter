name: ngrok_flutter
description: A Flutter FFI plugin enabling secure ngrok tunnels directly within Flutter applications across mobile and desktop.
version: 0.0.1
homepage: https://github.com/rishabvsnv/ngrok_flutter
repository: https://github.com/rishabvsnv/ngrok_flutter
issue_tracker: https://github.com/rishabvsnv/ngrok_flutter/issues

environment:
  sdk: ^3.10.8
  flutter: '>=3.3.0'

dependencies:
  ffi: ^2.1.3
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  ffigen: ^13.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true